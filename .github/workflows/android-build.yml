name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload Release APK (Smooth & Optimized)
        uses: actions/upload-artifact@v4
        with:
          name: bebasutang-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bebasutang-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
